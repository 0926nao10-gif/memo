<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>要素分解メモ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>要素分解メモ</h1>
      <div class="header-actions">
        <button id="resetTemplateButton" class="secondary-button">リセット</button>
        <button id="exportButton" class="primary-button">JSON保存</button>
        <label class="import-label">
          JSON読込
          <input id="importInput" type="file" accept="application/json" />
        </label>
      </div>
    </header>

    <main class="layout">
      <section class="panel editor-panel" aria-labelledby="editorTitle">
        <div class="panel-heading">
          <h2 id="editorTitle">選択中の要素</h2>
          <span id="saveStatus" class="save-status">保存済み</span>
        </div>

        <div class="form-grid">
          <label>
            見出し
            <input id="headingInput" type="text" />
          </label>
          <label>
            中身
            <textarea id="contentInput" rows="8"></textarea>
          </label>
          <label>
            色
            <input id="colorInput" class="color-input" type="color" />
          </label>
        </div>

        <div class="button-row">
          <button id="addChildButton" class="primary-button">枝を追加</button>
          <button id="addSiblingButton" class="secondary-button">同階層に追加</button>
          <button id="deleteButton" class="danger-button">削除</button>
        </div>
      </section>

      <section class="panel tree-panel" aria-labelledby="treeTitle">
        <div class="panel-heading">
          <h2 id="treeTitle">ツリー</h2>
          <button id="expandAllButton" class="secondary-button small-button">開閉</button>
        </div>
        <div id="treeContainer" class="tree-container" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
