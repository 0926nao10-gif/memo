<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>要素分解メモ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Memo Tree</p>
        <h1>要素分解メモ</h1>
        <p class="lead">メモを「見出し」と「中身」で作り、各メモから枝を生やして、さらに細かいメモへ分解できます。</p>
      </div>
      <div class="header-actions">
        <button id="resetTemplateButton" class="secondary-button">初期状態に戻す</button>
        <button id="exportButton" class="primary-button">JSON保存</button>
        <label class="import-label">
          JSON読込
          <input id="importInput" type="file" accept="application/json" />
        </label>
      </div>
    </header>

    <main class="layout">
      <section class="panel editor-panel" aria-labelledby="editorTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Editor</p>
            <h2 id="editorTitle">選択中のメモ</h2>
          </div>
          <span id="saveStatus" class="save-status">自動保存済み</span>
        </div>

        <div class="form-grid">
          <label>
            見出し
            <input id="headingInput" type="text" placeholder="例：サークル運営で頑張ったこと" />
          </label>
          <label class="full-width">
            中身
            <textarea id="contentInput" rows="10" placeholder="例：課題、行動、結果、学びなどを書く"></textarea>
          </label>
        </div>

        <div class="button-row">
          <button id="addChildButton" class="primary-button">このメモから枝を生やす</button>
          <button id="addSiblingButton" class="secondary-button">同じ階層にメモを追加</button>
          <button id="deleteButton" class="danger-button">選択メモを削除</button>
        </div>

        <section class="tips">
          <h3>使い方</h3>
          <ol class="how-to-list">
            <li>右側のメモをクリックして選択する</li>
            <li>左側で「見出し」と「中身」を編集する</li>
            <li>「このメモから枝を生やす」で、その先に子メモを追加する</li>
          </ol>
        </section>
      </section>

      <section class="panel tree-panel" aria-labelledby="treeTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Tree</p>
            <h2 id="treeTitle">メモの要素分解図</h2>
          </div>
          <button id="expandAllButton" class="secondary-button small-button">全て開く/閉じる</button>
        </div>
        <div id="treeContainer" class="tree-container" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
