<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自己分析 要素分解メモ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Career Self Analysis</p>
        <h1>自己分析 要素分解メモ</h1>
        <p class="lead">経験・価値観・強みをツリー状に分解して、ESや面接で使える材料に整理できます。</p>
      </div>
      <div class="header-actions">
        <button id="resetTemplateButton" class="secondary-button">テンプレートに戻す</button>
        <button id="exportButton" class="primary-button">JSON保存</button>
        <label class="import-label">
          JSON読込
          <input id="importInput" type="file" accept="application/json" />
        </label>
      </div>
    </header>

    <main class="layout">
      <section class="panel editor-panel" aria-labelledby="editorTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Input</p>
            <h2 id="editorTitle">選択中のメモ</h2>
          </div>
          <span id="saveStatus" class="save-status">自動保存済み</span>
        </div>

        <div class="form-grid">
          <label>
            タイトル
            <input id="titleInput" type="text" placeholder="例：合宿幹事での参加率改善" />
          </label>
          <label>
            タグ
            <input id="tagInput" type="text" placeholder="例：課題解決, 巻き込み, DX" />
          </label>
          <label class="full-width">
            内容メモ
            <textarea id="bodyInput" rows="9" placeholder="事実、課題、工夫、結果、学びなどをメモ"></textarea>
          </label>
        </div>

        <div class="button-row">
          <button id="addChildButton" class="primary-button">下の要素を追加</button>
          <button id="addSiblingButton" class="secondary-button">同じ階層に追加</button>
          <button id="deleteButton" class="danger-button">削除</button>
        </div>

        <section class="tips">
          <h3>自己分析で分解するとよい観点</h3>
          <div class="tip-grid">
            <span>経験</span>
            <span>課題</span>
            <span>行動</span>
            <span>結果</span>
            <span>強み</span>
            <span>価値観</span>
            <span>再現性</span>
            <span>企業での活かし方</span>
          </div>
        </section>
      </section>

      <section class="panel tree-panel" aria-labelledby="treeTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Map</p>
            <h2 id="treeTitle">要素分解図</h2>
          </div>
          <button id="expandAllButton" class="secondary-button small-button">全て開く/閉じる</button>
        </div>
        <div id="treeContainer" class="tree-container" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
